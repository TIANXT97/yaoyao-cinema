name: Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号标签 (例如 v1.0.3)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout Code)
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装项目根依赖 (Install Root Dependencies)
        run: |
          npm ci || npm install

      - name: 安装前端依赖并构建 (Build Frontend)
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          cd ..

      - name: 同步 Capacitor 原生工程 (Capacitor Sync)
        run: |
          npx cap sync android

      - name: 设置 Java 21 环境 (Setup JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 赋予 Gradle 包装器执行权限
        run: |
          chmod +x android/gradlew

      - name: 编译 Release APK (Assemble Release APK)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: 提取产物并重命名
        id: prep_apk
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          APK_SRC=$(find "$RELEASE_DIR" -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "错误: 未找到生成的 APK 产物!"
            exit 1
          fi

          # 计算版本 Tag
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.x-$(date +'%Y%m%d%H%M')"
          fi

          OUTPUT_APK="yaoyao-cinema-${TAG_NAME}.apk"
          cp "$APK_SRC" "$OUTPUT_APK"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${OUTPUT_APK}" >> "$GITHUB_OUTPUT"
          echo "已成功生成产物: ${OUTPUT_APK} (大小: $(du -h "${OUTPUT_APK}" | cut -f1))"

      - name: 上传构建产物 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep_apk.outputs.apk_path }}
          path: ${{ steps.prep_apk.outputs.apk_path }}
          retention-days: 7

      - name: 发布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != ''
        with:
          tag_name: ${{ steps.prep_apk.outputs.tag_name }}
          name: 夭夭影社 ${{ steps.prep_apk.outputs.tag_name }}
          files: ${{ steps.prep_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
